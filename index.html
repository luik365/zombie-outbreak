<!doctype html><html><head><meta charset='utf-8'><title>Zombie Outbreak</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#111}canvas{display:block;width:100%;height:100%;cursor:crosshair}#ui{position:fixed;top:10px;left:10px;color:white;font:18px Arial;background:#0008;padding:10px;border-radius:8px}#msg{position:fixed;inset:0;display:grid;place-items:center;background:#0009;color:white;font:28px Arial;text-align:center}button{font-size:22px;padding:10px 25px}</style></head><body><canvas id=c></canvas><div id=ui>WASD/Arrows: move • Mouse: aim • Click/Space: shoot</div><div id=msg><div><h1>Zombie Outbreak</h1><p>Survive the zombie waves!</p><button onclick='start()'>PLAY</button></div></div><script>
const c=document.getElementById('c'),x=c.getContext('2d'),ui=document.getElementById('ui'),msg=document.getElementById('msg');let W,H,p,z,b,keys={},mx=0,my=0,down=0,score,wave,over,spawn,shot,last;
function size(){W=c.width=innerWidth;H=c.height=innerHeight}addEventListener('resize',size);size();
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.code==='Space')e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);c.onmousemove=e=>{mx=e.clientX;my=e.clientY};c.onmousedown=()=>down=1;onmouseup=()=>down=0;
function start(){p={x:W/2,y:H/2,hp:100};z=[];b=[];score=0;wave=1;spawn=0;shot=0;over=0;msg.style.display='none';last=performance.now();requestAnimationFrame(loop)}
function addZombie(){let s=(Math.random()*4)|0,q=35,xx=s==0?-q:s==1?W+q:Math.random()*W,yy=s==2?-q:s==3?H+q:Math.random()*H;z.push({x:xx,y:yy,r:14,h:2,sp:55+wave*3+Math.random()*25})}
function shoot(){if(shot>0)return;shot=.13;let a=Math.atan2(my-p.y,mx-p.x);b.push({x:p.x,y:p.y,vx:Math.cos(a)*700,vy:Math.sin(a)*700,l:1})}
function update(dt){let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(dx||dy){let l=Math.hypot(dx,dy);p.x+=dx/l*250*dt;p.y+=dy/l*250*dt}p.x=Math.max(16,Math.min(W-16,p.x));p.y=Math.max(16,Math.min(H-16,p.y));if(down||keys[' '])shoot();shot-=dt;spawn-=dt;if(spawn<=0){addZombie();spawn=Math.max(.2,1-wave*.035)}if(score>=wave*10)wave++;for(let i=b.length-1;i>=0;i--){let q=b[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt;if(q.l<0||q.x<0||q.x>W||q.y<0||q.y>H)b.splice(i,1)}for(let i=z.length-1;i>=0;i--){let q=z[i],a=Math.atan2(p.y-q.y,p.x-q.x);q.x+=Math.cos(a)*q.sp*dt;q.y+=Math.sin(a)*q.sp*dt;if(Math.hypot(p.x-q.x,p.y-q.y)<28)p.hp-=30*dt;for(let j=b.length-1;j>=0;j--){let r=b[j];if(Math.hypot(r.x-q.x,r.y-q.y)<q.r+5){q.h--;b.splice(j,1);if(q.h<=0){score++;z.splice(i,1)}break}}}if(p.hp<=0){p.hp=0;over=1}}
function draw(){x.fillStyle='#202522';x.fillRect(0,0,W,H);x.strokeStyle='#2d3530';for(let i=0;i<W;i+=40){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}for(let i=0;i<H;i+=40){x.beginPath();x.moveTo(0,i);x.lineTo(W,i);x.stroke()}x.fillStyle='#ffe477';b.forEach(q=>{x.beginPath();x.arc(q.x,q.y,4,0,7);x.fill()});z.forEach(q=>{x.fillStyle='#55a052';x.beginPath();x.arc(q.x,q.y,q.r,0,7);x.fill();x.fillStyle='#111';x.beginPath();x.arc(q.x-5,q.y-3,2,0,7);x.arc(q.x+5,q.y-3,2,0,7);x.fill()});let a=Math.atan2(my-p.y,mx-p.x);x.save();x.translate(p.x,p.y);x.rotate(a);x.fillStyle='#ddd';x.fillRect(5,-4,25,8);x.fillStyle='#4c91d1';x.beginPath();x.arc(0,0,16,0,7);x.fill();x.restore();x.fillStyle='#0009';x.fillRect(10,10,250,75);x.fillStyle='white';x.font='18px Arial';x.fillText('Score: '+score,20,35);x.fillText('Wave: '+wave,20,60);x.fillStyle='#333';x.fillRect(20,68,210,10);x.fillStyle='#e44';x.fillRect(20,68,210*p.hp/100,10);if(over){x.fillStyle='#000b';x.fillRect(0,0,W,H);x.fillStyle='white';x.textAlign='center';x.font='50px Arial';x.fillText('GAME OVER',W/2,H/2);x.font='22px Arial';x.fillText('Score: '+score+'  Wave: '+wave,W/2,H/2+40);x.textAlign='left';msg.style.display='grid';msg.querySelector('h1').textContent='Game Over';msg.querySelector('p').textContent='Score: '+score+' • Wave: '+wave;msg.querySelector('button').textContent='PLAY AGAIN'}}
function loop(t){if(over){draw();return}let dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}
</script></body></html>
